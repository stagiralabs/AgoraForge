<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>__PAGE_TITLE__</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
  <script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
  <script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
  <style>
    :root {
      --bg: #f4efe6;
      --panel: #fffaf2;
      --ink: #1f1a14;
      --muted: #655d52;
      --line: #d9ccbb;
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, 0.12);
      --warning: #b45309;
      --shadow: 0 14px 30px rgba(31, 26, 20, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.75), transparent 36%),
        linear-gradient(180deg, #f8f4ec 0%, #ece1cf 100%);
    }
    .page {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 14px clamp(14px, 1.5vw, 28px) 20px;
    }
    .header {
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.1;
    }
    .muted {
      color: var(--muted);
    }
    .controls {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid rgba(15, 118, 110, 0.35);
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    button:hover {
      background: rgba(15, 118, 110, 0.2);
    }
    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .view-toggle button {
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 16px;
    }
    .view-toggle button:hover {
      background: rgba(15, 118, 110, 0.08);
    }
    .view-toggle button.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }
    label {
      font-weight: 600;
    }
    input[type="range"] {
      flex: 0 1 200px;
      accent-color: var(--accent);
    }
    .step-readout {
      min-width: 52px;
      text-align: center;
      font-weight: 700;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }
    .layout.view-global {
      grid-template-areas:
        "graph graph"
        "returns returns";
    }
    .layout.view-agent {
      grid-template-areas:
        "actor-inputs actor-inputs";
    }
    .layout.view-global .panel.actor-inputs { display: none; }
    .layout.view-agent .panel.graph,
    .layout.view-agent .panel.returns { display: none; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 12px;
      min-width: 0;
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 15px;
    }
    .panel.graph { grid-area: graph; }
    .panel.returns { grid-area: returns; }
    .panel.actor-inputs { grid-area: actor-inputs; }
    .chart-shell {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
    }
    .chart-svg {
      width: 100%;
      height: 300px;
      display: block;
    }
    .jobs-svg {
      width: 100%;
      display: block;
    }
    .jobs-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .jobs-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .jobs-legend i { width: 16px; height: 12px; border-radius: 3px; display: inline-block; }
    .jobs-legend i.proof { width: 12px; height: 12px; border-radius: 50%; }
    .graph-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      min-height: clamp(560px, calc(100vh - 245px), 960px);
    }
    #cy {
      width: 100%;
      height: clamp(560px, calc(100vh - 245px), 960px);
      display: block;
    }
    .tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      max-width: 260px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(31, 26, 20, 0.94);
      color: #fffaf2;
      font-size: 12px;
      line-height: 1.45;
      box-shadow: 0 8px 22px rgba(31, 26, 20, 0.3);
      z-index: 2;
    }
    .tooltip .green {
      color: #8ae38a;
    }
    .panel-note {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .market-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .market-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.72);
      font-size: 12px;
      cursor: pointer;
    }
    .market-legend-item.active {
      border-color: var(--accent);
      font-weight: 700;
    }
    .market-swatch {
      width: 14px;
      height: 3px;
      border-radius: 2px;
      flex: 0 0 auto;
    }
    .actor-graph-wrap {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
      gap: 12px;
    }
    .actor-cy-shell {
      position: relative;
      border-radius: 10px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      min-height: 420px;
    }
    #actorCy {
      width: 100%;
      height: 420px;
      display: block;
    }
    .actor-detail {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.72);
      padding: 10px 12px;
      font-size: 12px;
      max-height: 420px;
      overflow: auto;
    }
    .actor-detail h3 {
      margin: 0 0 6px;
      font-size: 13px;
    }
    .actor-detail table {
      width: 100%;
      border-collapse: collapse;
    }
    .actor-detail td {
      padding: 2px 6px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    .actor-detail td.k { color: var(--muted); }
    .actor-detail td.v {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .actor-detail td.v.zero { color: #b9ac98; }
    .actor-detail details { margin-top: 10px; }
    .actor-detail summary { cursor: pointer; font-weight: 700; color: var(--muted); }
    .actor-detail pre {
      max-height: 220px;
      overflow: auto;
      margin: 8px 0 0;
      font-size: 11px;
      line-height: 1.35;
      white-space: pre-wrap;
    }
    .actor-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .actor-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .actor-legend i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
    @media (max-width: 980px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }
      .layout.view-global {
        grid-template-areas:
          "graph"
          "returns";
      }
      .layout.view-agent {
        grid-template-areas:
          "actor-inputs";
      }
      .actor-graph-wrap {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>__PAGE_HEADING__</h1>
      <div class="muted" id="summary"></div>
    </div>

    <div class="controls">
      <div class="controls-row">
        <button id="stepBack" type="button" title="Previous frame">◀</button>
        <button id="playPause" type="button">Autoplay</button>
        <button id="stepFwd" type="button" title="Next frame">▶</button>
        <input id="stepRange" type="range" min="0" value="0">
        <div class="step-readout" id="stepReadout"></div>
        <label for="viewToggle">View</label>
        <div class="view-toggle" id="viewToggle"></div>
      </div>
    </div>

    <div class="layout view-global" id="layout">
      <section class="panel actor-inputs">
        <h2 id="agentViewTitle">Agent View</h2>
        <div class="chart-shell">
          <svg class="jobs-svg" id="agentJobsChart"></svg>
        </div>
        <div class="jobs-legend">
          <span><i style="background:#2563eb"></i>prove job</span>
          <span><i style="background:#7c3aed"></i>conjecture job</span>
          <span><i class="proof" style="background:#16a34a"></i>public resolution</span>
          <span><i class="proof" style="background:#16a34a;opacity:0.45"></i>new concrete</span>
          <span>border: <b style="color:#b45309">target</b>, grey neither</span>
        </div>
        <div class="panel-note" id="agentJobsNote"></div>

        <h2 style="margin-top:14px">Actor Network Graph</h2>
        <div class="actor-graph-wrap">
          <div class="actor-cy-shell"><div id="actorCy"></div></div>
          <div class="actor-detail" id="actorDetail"></div>
        </div>
        <div class="actor-legend">
          <span><i style="background:#0f766e"></i>global &harr; formula</span>
          <span><i style="background:#8b5cf6"></i>negation (&phi;/&not;&phi;)</span>
          <span><i style="background:#0891b2"></i>query-related (&rarr;)</span>
        </div>
      </section>

      <section class="panel graph">
        <h2>Library State Graph</h2>
        <div class="graph-shell" id="graphShell">
          <div id="cy"></div>
          <canvas id="cyOverlay" style="position:absolute;top:0;left:0;pointer-events:none;"></canvas>
          <div class="tooltip" id="graphTooltip"></div>
        </div>
        <div class="panel-note" id="graphNote"></div>
      </section>

      <section class="panel returns">
        <h2>Return Over Time</h2>
        <div class="chart-shell">
          <svg class="chart-svg" id="returnChart" viewBox="0 0 840 300"></svg>
        </div>
      </section>

    </div>
  </div>

  <script id="viewerData" type="application/json">__PAYLOAD_JSON__</script>
  <script>
    const payload = JSON.parse(document.getElementById("viewerData").textContent);
    const frames = payload.frames;
    const series = payload.series;
    const agentColors = payload.agent_colors;
    const formulaNodes = payload.formula_nodes;
    const utilityEdges = payload.utility_edges;
    const stepRange = document.getElementById("stepRange");
    const stepReadout = document.getElementById("stepReadout");
    const summary = document.getElementById("summary");
    const playPause = document.getElementById("playPause");
    const tooltip = document.getElementById("graphTooltip");
    const graphNote = document.getElementById("graphNote");
    const layout = document.getElementById("layout");
    const viewToggle = document.getElementById("viewToggle");
    let currentFrame = 0;
    let autoplayTimer = null;
    let selectedAgent = null; // null = global view, otherwise the agent index
    let highlightedFormula = null; // phi of the selected formula in the graph

    const modeLabel = payload.centralized ? "centralized planner" : payload.control_mode;
    summary.textContent = `${modeLabel} | timesteps=${Math.max(frames.length - 1, 0)} | agents=${payload.num_agents}`;
    stepRange.max = Math.max(frames.length - 1, 0);

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    // Fill colour encodes truth: blue for the true member of a pair, red for the false one
    const TRUE_FILL = "rgb(59, 130, 246)";
    const FALSE_FILL = "rgb(220, 38, 38)";

    // phi -> label / truth, shared by the library graph and the actor graph
    const labelByPhi = new Map(formulaNodes.map((n) => [Number(n.phi), n.label]));
    const truthByPhi = new Map(formulaNodes.map((n) => [Number(n.phi), Boolean(n.truth)]));

    const numTheoremsVal = Number(payload.num_theorems);
    const isCentralized = Boolean(payload.centralized);
    const targetTheorems = new Set((payload.target_theorems || []).map(Number));
    const initialResolvedTheorems = new Set(
      ((frames[0] && frames[0].public_resolved) || [])
        .map((phi) => Number(phi) % numTheoremsVal)
    );

    // Role of a formula relative to the rollout's targets, for colour coding.
    function targetRole(phi) {
        if (targetTheorems.has(Number(phi) % numTheoremsVal)) return "target";
        return "other";
    }
    const ROLE_COLOR = { target: "#b45309", other: "#9a8f80" };

    function formulaSet(items) {
      return new Set(items.map(value => Number(value)));
    }

    function buildFrameState(frame) {
      const publicConcrete = formulaSet(frame.public_concrete);
      const publicResolved = formulaSet(frame.public_resolved);
      const privateConcrete = frame.private_concrete_agents.map(formulaSet);
      const privateResolved = frame.private_resolved_agents.map(formulaSet);
      return { publicConcrete, publicResolved, privateConcrete, privateResolved };
    }

    function tooltipHtml(node, state) {
      const phi = Number(node.phi);
      const publicConcrete = state.publicConcrete.has(phi);
      const publicResolved = state.publicResolved.has(phi);
      const privateConcreteAgents = [];
      const privateResolvedAgents = [];
      for (let agentId = 0; agentId < payload.num_agents; agentId += 1) {
        if (state.privateResolved[agentId].has(phi)) {
          privateResolvedAgents.push(agentId);
        } else if (state.privateConcrete[agentId].has(phi)) {
          privateConcreteAgents.push(agentId);
        }
      }
      const lines = [
        `<strong>${escapeHtml(node.label)} (id=${phi})</strong>`,
        `Public state: ${publicConcrete ? "concrete" : "ghost"}`,
        `Publicly resolved: ${publicResolved ? "yes" : "no"}`,
        `Truth: ${node.truth ? "true" : "false"}`
      ];
      if (!publicConcrete && privateConcreteAgents.length) {
        lines.push(`Private concrete: ${privateConcreteAgents.map(id => escapeHtml(`a_${id}`)).join(", ")}`);
      }
      if (!publicResolved && privateResolvedAgents.length) {
        lines.push(`<span class="green">Private resolved: ${privateResolvedAgents.map(id => escapeHtml(`a_${id}`)).join(", ")}</span>`);
      }
      return lines.join("<br>");
    }

    function describeGraphAvailability() {
      graphNote.textContent = "Shells are anchored at the initially resolved public theorems. Drag nodes to rearrange; scroll to zoom; drag background to pan.";
    }

    // ---- Striped SVG for private-concrete fill ----
    function stripesSvg(color) {
      return "data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="46" height="46">' +
        '<rect width="46" height="46" fill="' + color + '"/>' +
        '<g stroke="rgba(255,255,255,0.55)" stroke-width="3">' +
        '<line x1="-2" y1="6" x2="6" y2="-2"/><line x1="-2" y1="14" x2="14" y2="-2"/>' +
        '<line x1="-2" y1="22" x2="22" y2="-2"/><line x1="-2" y1="30" x2="30" y2="-2"/>' +
        '<line x1="-2" y1="38" x2="38" y2="-2"/><line x1="-2" y1="46" x2="46" y2="-2"/>' +
        '<line x1="6" y1="48" x2="48" y2="6"/><line x1="14" y1="48" x2="48" y2="14"/>' +
        '<line x1="22" y1="48" x2="48" y2="22"/><line x1="30" y1="48" x2="48" y2="30"/>' +
        '<line x1="38" y1="48" x2="48" y2="38"/>' +
        '</g></svg>'
      );
    }

    // Map a utility weight (0..1) to a blue ramp: faint pale blue for weak links,
    // saturated deep blue for strong ones, so heavier weights pop out.
    function weightColor(w) {
      if (w === undefined || w === null) return "#9fb2c9";
      var t = Math.max(0, Math.min(1, Number(w)));
      var hue = 205 + 18 * t;
      var sat = 25 + 62 * t;
      var light = 78 - 46 * t;
      return "hsl(" + hue.toFixed(0) + ", " + sat.toFixed(0) + "%, " + light.toFixed(0) + "%)";
    }
    function weightWidth(w) {
      if (w === undefined || w === null) return 1.2;
      return 1.0 + 1.8 * Math.max(0, Math.min(1, Number(w)));
    }
    function weightOpacity(w) {
      if (w === undefined || w === null) return 0.6;
      return 0.3 + 0.55 * Math.max(0, Math.min(1, Number(w)));
    }

    // ---- Build Cytoscape elements ----
    const cyElements = [];
    // Compound parents: one per theorem so phi/not-phi move as a unit
    const seenTheorems = new Set();
    formulaNodes.forEach(function(node) {
      var tid = Number(node.theorem_id);
      if (!seenTheorems.has(tid)) {
        seenTheorems.add(tid);
        cyElements.push({ group: "nodes", data: { id: "t" + tid, isParent: true } });
      }
      cyElements.push({
        group: "nodes",
        data: {
          id: "n" + node.phi, parent: "t" + tid,
          phi: Number(node.phi), label: node.label,
          truth: Boolean(node.truth),
        },
        position: { x: node.x, y: node.y },
      });
    });
    function backboneEdgeIds() {
      const theoremIds = Array.from({ length: numTheoremsVal }, (_, idx) => idx);
      const neighbors = new Map(theoremIds.map((id) => [id, new Set()]));
      utilityEdges.forEach(function(edge, idx) {
        const src = Number(edge.source) % numTheoremsVal;
        const dst = Number(edge.target) % numTheoremsVal;
        if (src !== dst) {
          neighbors.get(src).add(dst);
          neighbors.get(dst).add(src);
        }
      });

      let anchors = [...initialResolvedTheorems].filter((id) => id >= 0 && id < numTheoremsVal);
      if (!anchors.length) {
        anchors = theoremIds
          .slice()
          .sort((a, b) => neighbors.get(b).size - neighbors.get(a).size || a - b)
          .slice(0, Math.min(4, theoremIds.length));
      }
      const distance = new Map();
      const queue = anchors.slice().sort((a, b) => a - b);
      queue.forEach((id) => distance.set(id, 0));
      let qIndex = 0;
      while (qIndex < queue.length) {
        const src = queue[qIndex++];
        [...neighbors.get(src)].sort((a, b) => a - b).forEach((dst) => {
          if (!distance.has(dst)) {
            distance.set(dst, distance.get(src) + 1);
            queue.push(dst);
          }
        });
      }

      const bestBridge = new Map();
      const targetAdjacent = [];
      utilityEdges.forEach(function(edge, idx) {
        const srcTheorem = Number(edge.source) % numTheoremsVal;
        const dstTheorem = Number(edge.target) % numTheoremsVal;
        if (srcTheorem === dstTheorem) return;
        const srcDistance = distance.get(srcTheorem) ?? Infinity;
        const dstDistance = distance.get(dstTheorem) ?? Infinity;
        const farther = srcDistance >= dstDistance ? srcTheorem : dstTheorem;
        const closerDistance = Math.min(srcDistance, dstDistance);
        const src = Number(edge.source);
        const dst = Number(edge.target);
        const weight = Number(edge.weight);
        if (targetTheorems.has(srcTheorem) || targetTheorems.has(dstTheorem)) {
          targetAdjacent.push({ idx, weight });
        }
        const prev = bestBridge.get(farther);
        if (!prev || weight > prev.weight || (weight === prev.weight && idx < prev.idx)) {
          bestBridge.set(farther, { idx, weight, src, dst });
        }
      });
      targetAdjacent.sort((a, b) => b.weight - a.weight || a.idx - b.idx);
      return new Set([
        ...[...bestBridge.values()].map((item) => item.idx),
        ...targetAdjacent.slice(0, 24).map((item) => item.idx),
      ]);
    }

    const backboneEdges = backboneEdgeIds();
    utilityEdges.forEach(function(edge, idx) {
      var w = Number(edge.weight);
      cyElements.push({
        group: "edges",
        data: {
          id: "e" + idx, source: "n" + edge.source, target: "n" + edge.target,
          weight: w, backbone: backboneEdges.has(idx),
          sourcePhi: Number(edge.source), targetPhi: Number(edge.target),
        },
      });
    });
    // Invisible bonds tying each formula to its negation so negated pairs stay tightly coupled
    var numTheorems = Number(payload.num_theorems);
    for (var tid = 0; tid < numTheorems; tid++) {
      cyElements.push({
        group: "edges",
        data: { id: "pair" + tid, source: "n" + tid, target: "n" + (tid + numTheorems), pairbond: true },
      });
    }

    function graphLayoutPositions() {
      const theoremIds = Array.from({ length: numTheorems }, (_, idx) => idx);
      const neighbors = new Map(theoremIds.map((id) => [id, new Set()]));

      utilityEdges.forEach((edge) => {
        const src = Number(edge.source) % numTheorems;
        const dst = Number(edge.target) % numTheorems;
        if (src === dst || !neighbors.has(src) || !neighbors.has(dst)) return;
        neighbors.get(src).add(dst);
        neighbors.get(dst).add(src);
      });

      let anchors = [...initialResolvedTheorems].filter((id) => id >= 0 && id < numTheorems);
      if (!anchors.length) {
        anchors = theoremIds
          .slice()
          .sort((a, b) => neighbors.get(b).size - neighbors.get(a).size || a - b)
          .slice(0, Math.min(4, theoremIds.length));
      }

      const distance = new Map();
      const queue = anchors.slice().sort((a, b) => a - b);
      queue.forEach((id) => distance.set(id, 0));
      let qIndex = 0;
      while (qIndex < queue.length) {
        const src = queue[qIndex++];
        const nextDistance = distance.get(src) + 1;
        [...neighbors.get(src)].sort((a, b) => a - b).forEach((dst) => {
          if (!distance.has(dst)) {
            distance.set(dst, nextDistance);
            queue.push(dst);
          }
        });
      }

      const unreachableDistance = Math.max(0, ...distance.values()) + 1;
      theoremIds.forEach((id) => {
        if (!distance.has(id)) distance.set(id, unreachableDistance);
      });

      const shells = new Map();
      theoremIds.forEach((id) => {
        const d = distance.get(id);
        if (!shells.has(d)) shells.set(d, []);
        shells.get(d).push(id);
      });

      const shellOrder = new Map();
      const positions = new Map();
      const xGap = numTheorems >= 192 ? 74 : numTheorems >= 96 ? 82 : 96;
      const yGap = numTheorems >= 192 ? 86 : numTheorems >= 96 ? 94 : 108;
      const signGap = numTheorems >= 192 ? 27 : 30;
      let xOffset = 80;

      [...shells.keys()].sort((a, b) => a - b).forEach((d) => {
        const ids = shells.get(d);
        ids.sort((a, b) => {
          const prevA = [...neighbors.get(a)].filter((id) => distance.get(id) < d);
          const prevB = [...neighbors.get(b)].filter((id) => distance.get(id) < d);
          const orderA = prevA.length
            ? prevA.reduce((sum, id) => sum + (shellOrder.get(id) ?? id), 0) / prevA.length
            : a;
          const orderB = prevB.length
            ? prevB.reduce((sum, id) => sum + (shellOrder.get(id) ?? id), 0) / prevB.length
            : b;
          return orderA - orderB || neighbors.get(b).size - neighbors.get(a).size || a - b;
        });

        const cols = Math.max(1, Math.ceil(Math.sqrt(ids.length * 0.72)));
        ids.forEach((theoremId, idx) => {
          const col = idx % cols;
          const row = Math.floor(idx / cols);
          const x = xOffset + col * xGap;
          const y = 90 + row * yGap + (col % 2) * Math.min(24, yGap * 0.25);
          shellOrder.set(theoremId, row + col / Math.max(cols, 1));
          positions.set(theoremId, { x, y: y - signGap });
          positions.set(theoremId + numTheorems, { x, y: y + signGap });
        });

        xOffset += Math.max(190, (cols - 1) * xGap + 250);
      });
      return positions;
    }

    const graphPositions = graphLayoutPositions();

    // ---- Create Cytoscape with a deterministic dependency-layer layout ----
    var cy = cytoscape({
      container: document.getElementById("cy"),
      elements: cyElements,
      userZoomingEnabled: true,
      userPanningEnabled: true,
      boxSelectionEnabled: false,
      minZoom: 0.25,
      maxZoom: 3.0,
      style: [
        // Compound parents: invisible grouping container
        {
          selector: "node[?isParent]",
          style: {
            "shape": "roundrectangle",
            "background-opacity": 0,
            "border-width": 0,
            "padding": "6px",
            "label": "",
          },
        },
        // Formula child nodes
        {
          selector: "node[^isParent]",
          style: {
            "width": 46, "height": 46,
            "label": "data(label)",
            "text-valign": "center", "text-halign": "center",
            "font-size": 13, "font-weight": 700,
            "color": "#1f1a14",
            "text-outline-color": "rgba(255,250,242,0.8)", "text-outline-width": 1.5,
            "background-color": "#ccc",
            "border-width": 2, "border-color": "#53463a", "border-style": "solid",
          },
        },
        // Edges — colour, width and opacity all scale with weight so heavy links stand out
        {
          selector: "edge",
          style: {
            "width": function(ele) { return ele.data("backbone") ? weightWidth(ele.data("weight")) : 0.7; },
            "line-color": function(ele) { return weightColor(ele.data("weight")); },
            "target-arrow-color": function(ele) { return weightColor(ele.data("weight")); },
            "target-arrow-shape": "vee",
            "curve-style": "bezier", "arrow-scale": 0.55,
            "opacity": function(ele) { return ele.data("backbone") ? weightOpacity(ele.data("weight")) * 0.7 : 0.006; },
          },
        },
        {
          selector: "edge.detail",
          style: {
            "width": function(ele) { return weightWidth(ele.data("weight")); },
            "opacity": function(ele) { return weightOpacity(ele.data("weight")) * 0.2; },
            "arrow-scale": 0.65,
          },
        },
        {
          selector: "edge.neighbor",
          style: {
            "width": function(ele) { return weightWidth(ele.data("weight")) + 1.2; },
            "opacity": 0.9,
            "z-index": 5,
            "arrow-scale": 0.85,
          },
        },
        // Pair bonds are layout-only: invisible and non-interactive
        { selector: "edge[?pairbond]", style: { "opacity": 0, "events": "no", "label": "" } },
      ],
      layout: {
        name: "preset",
        fit: true,
        padding: 70,
        positions: function(node) {
          const phi = Number(node.data("phi"));
          return graphPositions.get(phi) || { x: 0, y: 0 };
        },
      },
    });

    function resizeGraph() {
      cy.resize();
      cy.fit(undefined, 70);
      drawOverlay();
    }
    window.addEventListener("resize", resizeGraph);
    if (window.ResizeObserver) {
      new ResizeObserver(resizeGraph).observe(document.getElementById("graphShell"));
    }

    // ---- Overlay canvas for rings and arcs ----
    var overlay = document.getElementById("cyOverlay");
    var overlayCtx = overlay.getContext("2d");

    function resizeOverlay() {
      var rect = cy.container().getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      overlay.width = rect.width * dpr;
      overlay.height = rect.height * dpr;
      overlay.style.width = rect.width + "px";
      overlay.style.height = rect.height + "px";
      overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawOverlay() {
      resizeOverlay();
      var w = parseFloat(overlay.style.width);
      var h = parseFloat(overlay.style.height);
      overlayCtx.clearRect(0, 0, w, h);

      var frame = frames[currentFrame];
      var state = buildFrameState(frame);

      cy.nodes("[^isParent]").forEach(function(cyNode) {
        var phi = cyNode.data("phi");
        var rp = cyNode.renderedPosition();
        var rw = cyNode.renderedWidth() / 2;
        var node = formulaNodes.find(function(n) { return Number(n.phi) === phi; });
        if (!node) return;

        var isPublicResolved = state.publicResolved.has(phi);
        var isPrivateResolved = false;
        for (var a = 0; a < payload.num_agents; a++) {
          if (state.privateResolved[a].has(phi)) isPrivateResolved = true;
        }

        // Target ring (outer), drawn first so the resolution ring sits inside it.
        var role = targetRole(phi);
        if (role !== "other") {
          overlayCtx.beginPath();
          overlayCtx.arc(rp.x, rp.y, rw + 9, 0, 2 * Math.PI);
          overlayCtx.lineWidth = 3;
          overlayCtx.strokeStyle = ROLE_COLOR[role];
          overlayCtx.setLineDash([]);
          overlayCtx.stroke();
        }

        // Resolution ring (inner ring, radius = node edge + 4)
        var ringR = rw + 4;
        if (isPublicResolved) {
          overlayCtx.beginPath();
          overlayCtx.arc(rp.x, rp.y, ringR, 0, 2 * Math.PI);
          overlayCtx.lineWidth = 4;
          overlayCtx.strokeStyle = "#16a34a";
          overlayCtx.setLineDash([]);
          overlayCtx.stroke();
        } else if (isPrivateResolved) {
          overlayCtx.beginPath();
          overlayCtx.arc(rp.x, rp.y, ringR, 0, 2 * Math.PI);
          overlayCtx.lineWidth = 4;
          overlayCtx.strokeStyle = "#16a34a";
          overlayCtx.setLineDash([5, 4]);
          overlayCtx.stroke();
          overlayCtx.setLineDash([]);
        }
      });
    }

    // Redraw overlay whenever Cytoscape renders (pan, zoom, drag, layout tick)
    cy.on("render", drawOverlay);
    cy.on("zoom", updateEdgeVisibility);

    // ---- Tooltip ----
    cy.on("mouseover", "node[^isParent]", function(event) {
      var nd = event.target.data();
      var node = formulaNodes.find(function(n) { return Number(n.phi) === nd.phi; });
      if (!node) return;
      tooltip.innerHTML = tooltipHtml(node, buildFrameState(frames[currentFrame]));
      tooltip.style.display = "block";
    });
    cy.on("mousemove", "node[^isParent]", function(event) {
      var shellRect = document.getElementById("graphShell").getBoundingClientRect();
      var rp = event.renderedPosition || event.position;
      tooltip.style.left = (rp.x + 14) + "px";
      tooltip.style.top = (rp.y + 14) + "px";
    });
    cy.on("mouseout", "node[^isParent]", function() { tooltip.style.display = "none"; });

    // Click a formula to highlight it; click again or click
    // the background to clear.
    cy.on("tap", "node[^isParent]", function(event) {
      var phi = Number(event.target.data("phi"));
      setHighlight(highlightedFormula === phi ? null : phi);
    });
    cy.on("tap", function(event) {
      if (event.target === cy) setHighlight(null);
    });

    // ---- renderGraph: update node styles per frame ----
    function renderGraph() {
      var frame = frames[currentFrame];
      var state = buildFrameState(frame);
      cy.batch(function() {
        cy.nodes("[^isParent]").forEach(function(cyNode) {
          var phi = cyNode.data("phi");
          var node = formulaNodes.find(function(n) { return Number(n.phi) === phi; });
          if (!node) return;

          var isPublicConcrete = state.publicConcrete.has(phi);
          var isPublicResolved = state.publicResolved.has(phi);
          var isPrivateConcrete = false;
          for (var a = 0; a < payload.num_agents; a++) {
            if (state.privateConcrete[a].has(phi)) isPrivateConcrete = true;
          }
          // Ghost = not concrete in any library (public or private)
          var isGhost = !isPublicConcrete && !isPrivateConcrete;

          // Always round; library state shown via opacity, stripes and border
          var truthFill = node.truth ? TRUE_FILL : FALSE_FILL;
          var styles = { "shape": "ellipse", "background-color": truthFill };

          if (isGhost) {
            // Ghost: barely-there hint of the truth colour, thin grey outline
            styles["background-opacity"] = 0.16;
            styles["background-image"] = "none";
          } else if (isPrivateConcrete && !isPublicConcrete) {
            // Striped fill for private-only concrete
            styles["background-opacity"] = 1;
            styles["background-image"] = stripesSvg(truthFill);
            styles["background-fit"] = "cover";
            styles["background-clip"] = "node";
          } else {
            // Public concrete — solid fill
            styles["background-opacity"] = 1;
            styles["background-image"] = "none";
          }

          styles["border-style"] = "solid";
          styles["border-color"] = isGhost ? "#c4bdb2" : "#53463a";
          styles["border-width"] = isGhost ? 1 : 2;

          // Selected formula (its market line is highlighted) gets an accent ring
          if (phi === highlightedFormula) {
            styles["border-color"] = "#0f766e";
            styles["border-width"] = 4;
          }

          cyNode.style(styles);
        });
      });
      // Overlay is redrawn automatically via cy "render" event
      updateEdgeVisibility();
    }

    function axisText(x, y, text, anchor = "middle") {
      return `<text x="${x}" y="${y}" fill="#655d52" font-size="12" text-anchor="${anchor}">${escapeHtml(text)}</text>`;
    }

    // Round a value to a "nice" 1/2/5 x 10^k number.
    function niceNum(x, round) {
      if (!(x > 0)) return 1;
      const exp = Math.floor(Math.log10(x));
      const f = x / Math.pow(10, exp);
      let nf;
      if (round) {
        nf = f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10;
      } else {
        nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
      }
      return nf * Math.pow(10, exp);
    }

    // Symmetric y-axis ticks centred on 0: a round step, with the limit a
    // multiple of that step large enough to contain the data.
    function symmetricTicks(maxAbs) {
      const safe = isFinite(maxAbs) && maxAbs > 1e-6 ? maxAbs : 1;
      const step = niceNum(safe / 3, true); // aim for ~3 steps per side
      const limit = Math.ceil(safe / step) * step;
      const ticks = [];
      for (let v = -limit; v <= limit + step * 1e-6; v += step) {
        ticks.push(Math.abs(v) < step * 1e-6 ? 0 : v);
      }
      return { limit, ticks };
    }

    function formatTick(v) {
      if (Math.abs(v) < 1e-9) return "0";
      return Number.isInteger(v) ? String(v) : v.toFixed(2);
    }

    function renderChart(svgId, config) {
      const svg = document.getElementById(svgId);
      const width = 840;
      const height = 300;
      const pad = { left: 58, right: 20, top: 18, bottom: 42 };
      const current = currentFrame;
      const xMax = Math.max(config.maxX, 1);
      const activeSeries = [];
      const allYValues = [];

      config.series.forEach((item) => {
        const values = item.full ? item.values.slice() : item.values.slice(0, current + 1);
        activeSeries.push({ ...item, values });
        values.forEach((value) => allYValues.push(Number(value)));
      });
      if (!allYValues.length) {
        allYValues.push(0, 1);
      }

      const maxAbs = Math.max(1e-9, ...allYValues.map((v) => Math.abs(Number(v))));
      const { limit: yLimit, ticks: yTicks } = symmetricTicks(maxAbs);
      const minY = -yLimit;
      const maxY = yLimit;

      function xFor(idx) {
        return pad.left + ((width - pad.left - pad.right) * idx / xMax);
      }

      function yFor(value) {
        return height - pad.bottom - ((height - pad.top - pad.bottom) * (value - minY) / (maxY - minY));
      }

      const grid = [];
      yTicks.forEach((tickVal) => {
        const y = yFor(tickVal);
        const zero = Math.abs(tickVal) < 1e-9;
        grid.push(`<line x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}" stroke="${zero ? "#b9ac98" : "#e3d8ca"}" stroke-width="${zero ? 1.4 : 1}"></line>`);
        grid.push(axisText(pad.left - 8, y + 4, formatTick(tickVal), "end"));
      });
      for (let i = 0; i <= 4; i += 1) {
        const xValue = Math.round(xMax * i / 4);
        const x = xFor(xValue);
        grid.push(`<line x1="${x}" y1="${pad.top}" x2="${x}" y2="${height - pad.bottom}" stroke="#efe6da" stroke-width="1"></line>`);
        grid.push(axisText(x, height - 14, String(xValue)));
      }

      const lines = activeSeries.map((item) => {
        if (!item.values.length) {
          return "";
        }
        const points = item.values.map((value, idx) => `${xFor(idx)},${yFor(Number(value))}`).join(" ");
        const dash = item.dashed ? `stroke-dasharray="7 5"` : "";
        return `<polyline fill="none" stroke="${item.color}" stroke-width="${item.width || 3}" ${dash} points="${points}"></polyline>`;
      }).join("");

      const cursorX = xFor(current);
      const cursor = `<line x1="${cursorX}" y1="${pad.top}" x2="${cursorX}" y2="${height - pad.bottom}" stroke="#1f1a14" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"></line>`;
      const axes = `
        <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height - pad.bottom}" stroke="#aa9d8e" stroke-width="1.5"></line>
        <line x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" stroke="#aa9d8e" stroke-width="1.5"></line>
        ${axisText(width / 2, height - 4, config.xLabel)}
        <text x="16" y="${height / 2}" fill="#655d52" font-size="12" text-anchor="middle" transform="rotate(-90 16 ${height / 2})">${escapeHtml(config.yLabel)}</text>
      `;

      const legend = activeSeries.map((item, idx) => (
        `<g transform="translate(${pad.left + idx * 138}, ${pad.top - 2})">
          <line x1="0" y1="0" x2="26" y2="0" stroke="${item.color}" stroke-width="${item.width || 3}" ${item.dashed ? 'stroke-dasharray="7 5"' : ''}></line>
          <text x="32" y="4" fill="#655d52" font-size="12">${escapeHtml(item.label)}</text>
        </g>`
      )).join("");

      svg.innerHTML = `${grid.join("")}${axes}${cursor}${lines}<g>${legend}</g>`;
    }

    // Set which formula is emphasised in the graph (null clears).
    function setHighlight(phi) {
      highlightedFormula = phi;
      renderGraph();
    }

    function updateEdgeVisibility() {
      const detailed = cy.zoom() > 1.25;
      cy.batch(function() {
        cy.edges().forEach(function(edge) {
          const adjacent = highlightedFormula !== null
            && (Number(edge.data("sourcePhi")) === highlightedFormula
                || Number(edge.data("targetPhi")) === highlightedFormula);
          edge.toggleClass("detail", detailed);
          edge.toggleClass("neighbor", adjacent);
        });
      });
    }

    // ---- Per-agent Actor Network Graph ----
    // Mirrors GraphActor's input graph: a global node (agent_scalars) plus one node
    // per concrete formula (formula_features row), with global<->formula edges,
    // negation edges (formula_ids[i] == neg_formula_ids[j]) and query-related edges
    // (query_related_edges[i][j] > 0). Clicking an element shows the data that
    // feeds its embedding.
    let actorCy = null;
    let actorSig = null;       // structural signature, to avoid needless relayout
    let actorSelection = null; // {kind:"node"|"edge", id}

    function actorObs() {
      return selectedAgent === null ? null : (frames[currentFrame].actor_inputs || [])[selectedAgent];
    }

    function actorNodeId(slot) {
      return slot === "g" ? "ag" : "af" + slot;
    }

    function visibleSlot(obs, slot) {
      const mask = obs.formula_mask || [];
      return mask[slot] === undefined ? true : Number(mask[slot]) > 0;
    }

    function buildActorElements(obs) {
      const ids = obs.formula_ids || [];
      const negIds = obs.neg_formula_ids || [];
      const edges = obs.query_related_edges || [];
      const slotByPhi = new Map();
      ids.forEach((phi, slot) => { if (visibleSlot(obs, slot)) slotByPhi.set(Number(phi), slot); });

      const els = [{ group: "nodes", data: { id: "ag", kind: "global", label: "agent" } }];
      ids.forEach((phi, slot) => {
        if (!visibleSlot(obs, slot)) return;
        const p = Number(phi);
        els.push({ group: "nodes", data: {
          id: actorNodeId(slot), kind: "formula", slot, phi: p,
          label: labelByPhi.get(p) || ("φ?" + p),
          truth: truthByPhi.get(p) === true,
        } });
        els.push({ group: "edges", data: {
          id: "eg" + slot, source: "ag", target: actorNodeId(slot), kind: "global",
        } });
      });
      ids.forEach((phi, slot) => {
        if (!visibleSlot(obs, slot)) return;
        const other = slotByPhi.get(Number(negIds[slot]));
        if (other !== undefined && other > slot) {
          els.push({ group: "edges", data: {
            id: "en" + slot + "_" + other,
            source: actorNodeId(slot), target: actorNodeId(other), kind: "negation",
          } });
        }
      });
      for (let i = 0; i < edges.length; i += 1) {
        if (!visibleSlot(obs, i)) continue;
        const row = edges[i] || [];
        for (let j = 0; j < row.length; j += 1) {
          if (i === j || !visibleSlot(obs, j)) continue;
          if (Number(row[j]) > 0) {
            els.push({ group: "edges", data: {
              id: "eq" + i + "_" + j,
              source: actorNodeId(i), target: actorNodeId(j), kind: "query",
            } });
          }
        }
      }
      return els;
    }

    function ensureActorCy() {
      if (actorCy) return actorCy;
      actorCy = cytoscape({
        container: document.getElementById("actorCy"),
        elements: [],
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false,
        minZoom: 0.25,
        maxZoom: 3.0,
        style: [
          { selector: 'node[kind = "global"]', style: {
            "shape": "round-rectangle", "width": 62, "height": 34,
            "label": "data(label)", "text-valign": "center", "text-halign": "center",
            "font-size": 12, "font-weight": 700, "color": "#fffaf2",
            "background-color": "#0f766e", "border-width": 2, "border-color": "#0b5048",
          } },
          { selector: 'node[kind = "formula"]', style: {
            "width": 40, "height": 40, "label": "data(label)",
            "text-valign": "center", "text-halign": "center",
            "font-size": 12, "font-weight": 700, "color": "#1f1a14",
            "text-outline-color": "rgba(255,250,242,0.85)", "text-outline-width": 1.5,
            "background-color": "#cbd5e1", "border-width": 2, "border-color": "#53463a",
          } },
          { selector: 'node[kind = "formula"][?truth]', style: { "background-color": "rgb(59, 130, 246)" } },
          { selector: 'node[kind = "formula"][!truth]', style: { "background-color": "rgb(220, 38, 38)" } },
          { selector: "node.sel", style: { "border-color": "#b45309", "border-width": 4 } },
          { selector: 'edge[kind = "global"]', style: {
            "curve-style": "bezier", "line-color": "#d9ccbb", "width": 1, "opacity": 0.5,
          } },
          { selector: 'edge[kind = "negation"]', style: {
            "curve-style": "bezier", "line-color": "#8b5cf6", "width": 2,
          } },
          { selector: 'edge[kind = "query"]', style: {
            "curve-style": "bezier", "line-color": "#0891b2", "width": 2,
            "target-arrow-shape": "vee", "target-arrow-color": "#0891b2", "arrow-scale": 0.8,
          } },
          { selector: "edge.sel", style: {
            "line-color": "#b45309", "target-arrow-color": "#b45309", "width": 4, "opacity": 1,
          } },
        ],
      });
      actorCy.on("tap", "node", (event) => { actorSelection = { kind: "node", id: event.target.id() }; markActorSelection(); renderActorDetail(); });
      actorCy.on("tap", "edge", (event) => { actorSelection = { kind: "edge", id: event.target.id() }; markActorSelection(); renderActorDetail(); });
      actorCy.on("tap", (event) => { if (event.target === actorCy) { actorSelection = null; markActorSelection(); renderActorDetail(); } });
      return actorCy;
    }

    function markActorSelection() {
      if (!actorCy) return;
      actorCy.elements().removeClass("sel");
      if (actorSelection) {
        const el = actorCy.getElementById(actorSelection.id);
        if (el) el.addClass("sel");
      }
    }

    function renderActorGraph() {
      if (selectedAgent === null) return; // global view: panel is hidden
      const detail = document.getElementById("actorDetail");
      const obs = actorObs();
      if (!obs || !obs.formula_ids || !obs.formula_ids.length) {
        if (actorCy) { actorCy.elements().remove(); }
        actorSig = null;
        detail.innerHTML = '<div class="muted">No actor observation for this frame (agent has no concrete formulas).</div>';
        return;
      }
      const els = buildActorElements(obs);
      const sig = JSON.stringify(els.map((e) => [e.data.id, e.data.kind, e.data.phi]));
      ensureActorCy();
      if (sig !== actorSig) {
        actorSig = sig;
        if (actorSelection && !els.some((e) => e.data.id === actorSelection.id)) actorSelection = null;
        actorCy.elements().remove();
        actorCy.add(els);
        actorCy.resize();
        actorCy.layout({
          name: "fcose", animate: false, quality: "proof", fit: true, padding: 30,
          uniformNodeDimensions: true, nodeSeparation: 130, numIter: 3000,
          idealEdgeLength: (edge) => edge.data("kind") === "negation" ? 6 : 200,
          edgeElasticity: (edge) => edge.data("kind") === "negation" ? 1.4 : 0.4,
          nodeRepulsion: () => 11000,
          gravity: 0.18, gravityRange: 4.0,
        }).run();
        markActorSelection();
      } else {
        actorCy.resize();
      }
      renderActorDetail();
    }

    function fmtFeat(value) {
      const v = Number(value);
      if (!isFinite(v)) return String(value);
      return Number.isInteger(v) ? String(v) : v.toFixed(4);
    }

    function featTable(rows) {
      return `<table>${rows.map(([k, v]) => {
        const zero = Math.abs(Number(v)) < 1e-9;
        return `<tr><td class="k">${escapeHtml(k)}</td><td class="v${zero ? " zero" : ""}">${fmtFeat(v)}</td></tr>`;
      }).join("")}</table>`;
    }

    function rawObsDetails(obs) {
      const legendText = JSON.stringify(payload.actor_input_legend || {}, null, 2);
      const obsText = JSON.stringify(obs, null, 2);
      return `<details><summary>Raw observation</summary><pre>${escapeHtml(obsText)}</pre></details>`
        + `<details><summary>Legend</summary><pre>${escapeHtml(legendText)}</pre></details>`;
    }

    function actorNodeLabel(obs, nodeEl) {
      if (!nodeEl || !nodeEl.length) return "?";
      if (nodeEl.data("kind") === "global") return "agent (global)";
      const phi = Number((obs.formula_ids || [])[nodeEl.data("slot")]);
      return labelByPhi.get(phi) || ("φ?" + phi);
    }

    function renderActorDetail() {
      if (selectedAgent === null) return;
      const detail = document.getElementById("actorDetail");
      const obs = actorObs();
      if (!obs) { detail.innerHTML = '<div class="muted">No actor observation.</div>'; return; }
      const legend = payload.actor_input_legend || {};

      if (!actorSelection) {
        detail.innerHTML = '<div class="muted">Click a node or edge to see the data that feeds its embedding.</div>' + rawObsDetails(obs);
        return;
      }

      if (actorSelection.kind === "node") {
        const el = actorCy.getElementById(actorSelection.id);
        if (!el || !el.length) { detail.innerHTML = '<div class="muted">Selection unavailable at this frame.</div>'; return; }
        if (el.data("kind") === "global") {
          const names = legend.agent_scalars || [];
          const vals = obs.agent_scalars || [];
          detail.innerHTML = `<h3>Global node</h3>`
            + `<div class="muted" style="margin-bottom:6px">Input <code>agent_scalars</code> → projected by <code>global_proj</code> into node 0.</div>`
            + featTable(vals.map((v, i) => [names[i] || ("scalar_" + i), v]))
            + rawObsDetails(obs);
        } else {
          const slot = el.data("slot");
          const names = legend.formula_features || [];
          const vals = (obs.formula_features || [])[slot] || [];
          const phi = Number((obs.formula_ids || [])[slot]);
          const negPhi = Number((obs.neg_formula_ids || [])[slot]);
          detail.innerHTML = `<h3>Formula node — ${escapeHtml(labelByPhi.get(phi) || ("φ?" + phi))}</h3>`
            + `<div class="muted" style="margin-bottom:6px">Row ${slot} of <code>formula_features</code> → projected by <code>formula_proj</code>. `
            + `id=${phi} (${escapeHtml(labelByPhi.get(phi) || "?")}), negation id=${negPhi} (${escapeHtml(labelByPhi.get(negPhi) || "?")}).</div>`
            + featTable(vals.map((v, i) => [names[i] || ("feat_" + i), v]))
            + rawObsDetails(obs);
        }
        return;
      }

      // edge
      const edge = actorCy.getElementById(actorSelection.id);
      if (!edge || !edge.length) { detail.innerHTML = '<div class="muted">Selection unavailable at this frame.</div>'; return; }
      const kind = edge.data("kind");
      const srcEl = actorCy.getElementById(edge.data("source"));
      const tgtEl = actorCy.getElementById(edge.data("target"));
      const srcL = actorNodeLabel(obs, srcEl);
      const tgtL = actorNodeLabel(obs, tgtEl);
      if (kind === "global") {
        const formulaL = srcL === "agent (global)" ? tgtL : srcL;
        detail.innerHTML = `<h3>Edge — global ↔ formula</h3>`
          + `<div class="muted">Connects the global node and ${escapeHtml(formulaL)}.</div>`
          + `<p>Edge embedding channel: <strong>EDGE_GLOBAL = 1</strong>. Structural link only — it carries no scalar values.</p>`;
      } else if (kind === "negation") {
        detail.innerHTML = `<h3>Edge — negation</h3>`
          + `<div class="muted">${escapeHtml(srcL)} ↔ ${escapeHtml(tgtL)} (φ and ¬φ).</div>`
          + `<p>Edge embedding channel: <strong>EDGE_NEGATION = 1</strong>. Derived from <code>formula_ids == neg_formula_ids</code>; no scalar values.</p>`;
      } else {
        const i = srcEl.data("slot");
        const j = tgtEl.data("slot");
        const w = Number(((obs.query_related_edges || [])[i] || [])[j]);
        detail.innerHTML = `<h3>Edge — query-related</h3>`
          + `<div class="muted">${escapeHtml(srcL)} → ${escapeHtml(tgtL)} (source → target).</div>`
          + featTable([["query_related_edges[src][tgt]", w]])
          + `<p class="muted">Drives the <code>EDGE_QUERY_FORWARD/REVERSE</code> channels and their <code>*_TIME</code> values, plus an attention bias <code>log1p(1 − w)</code>.</p>`;
      }
    }

    // ---- Per-agent job stream ----
    // One lane for the selected agent across the whole episode. Each timestep a prove/conj job
    // is running shows a coloured cell (height encodes the committed budget τ);
    // a marker flags steps where the public library gains a resolution (proof
    // landed) or an agent's concrete library grows (conjecture landed). Cell
    // border colour encodes whether the worked formula is a target or neither.
    const JOB_COLOR = { prove: "#2563eb", conj: "#7c3aed" };

    function maxTau() {
        let m = 1;
        frames.forEach((f) => (f.jobs || []).forEach((j) => { if (j) m = Math.max(m, Number(j.tau_eff)); }));
        return m;
    }

    function renderJobStream() {
        if (selectedAgent === null) return;
        const svg = document.getElementById("agentJobsChart");
        const nFrames = frames.length;
        const width = 980;
        const pad = { left: 42, right: 16, top: 14, bottom: 28 };
        const laneH = 64;
        const height = pad.top + pad.bottom + laneH;
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.style.height = height + "px";

        const xMax = Math.max(nFrames - 1, 1);
        const colW = (width - pad.left - pad.right) / xMax;
        const tauMax = maxTau();
        const parts = [];

        const tickEvery = Math.max(4, Math.ceil(xMax / 25));
        for (let t = 0; t <= xMax; t += tickEvery) {
            const x = pad.left + colW * t;
            parts.push(`<line x1="${x}" y1="${pad.top}" x2="${x}" y2="${height - pad.bottom}" stroke="#efe6da" stroke-width="1"></line>`);
            parts.push(`<text x="${x}" y="${height - 10}" fill="#655d52" font-size="11" text-anchor="middle">${t}</text>`);
        }
        parts.push(`<text x="${width / 2}" y="${height - 1}" fill="#655d52" font-size="11" text-anchor="middle">Timestep</text>`);

        const a = selectedAgent;
        const laneTop = pad.top;
        const laneBot = laneTop + laneH;
        parts.push(`<line x1="${pad.left}" y1="${laneBot}" x2="${width - pad.right}" y2="${laneBot}" stroke="#d9ccbb" stroke-width="1"></line>`);
        parts.push(`<text x="${pad.left - 10}" y="${laneTop + laneH / 2 + 4}" fill="${agentColors[a]}" font-size="13" font-weight="700" text-anchor="end">a_${a}</text>`);

        let prevResolved = new Set(frames[0].public_resolved.map(Number));
        let prevConcrete = new Set((frames[0].private_concrete_agents[a] || []).map(Number));
        for (let t = 1; t < nFrames; t += 1) {
            const frame = frames[t];
            const job = (frame.jobs || [])[a];
            const x = pad.left + colW * (t - 1) + 1;
            const w = Math.max(colW - 2, 1);
            if (job) {
                const tau = Number(job.tau_eff);
                const cellH = 12 + (laneH - 18) * (tau / tauMax);
                const y = laneBot - cellH;
                const role = targetRole(job.target_raw);
                parts.push(
                    `<rect x="${x}" y="${y}" width="${w}" height="${cellH}" rx="2" `
                    + `fill="${JOB_COLOR[job.type] || "#6b7280"}" fill-opacity="0.82" `
                    + `stroke="${ROLE_COLOR[role]}" stroke-width="2">`
                    + `<title>t=${t} ${job.type}${job.mode ? " (" + job.mode + ")" : ""} ${job.target} `
                    + `[${role}] tau_committed=${job.tau_eff} tau_remaining=${job.tau_rem}</title></rect>`
                );
            }
            const resolved = new Set(frame.public_resolved.map(Number));
            const concrete = new Set((frame.private_concrete_agents[a] || []).map(Number));
            const newResolved = [...resolved].some((p) => !prevResolved.has(p));
            const newConcrete = [...concrete].some((p) => !prevConcrete.has(p));
            const cx = x + w / 2;
            if (newResolved) {
                parts.push(`<circle cx="${cx}" cy="${laneTop + 8}" r="4.5" fill="#16a34a"></circle>`);
            }
            if (newConcrete) {
                parts.push(`<circle cx="${cx}" cy="${laneTop + 8}" r="4.5" fill="#16a34a" fill-opacity="0.45"></circle>`);
            }
            prevResolved = resolved;
            prevConcrete = concrete;
        }

        const cursorX = pad.left + colW * currentFrame;
        parts.push(`<line x1="${cursorX}" y1="${pad.top}" x2="${cursorX}" y2="${height - pad.bottom}" stroke="#1f1a14" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.5"></line>`);
        svg.innerHTML = parts.join("");

        const note = document.getElementById("agentJobsNote");
        const targetLabels = [...targetTheorems].sort((p, q) => p - q)
            .map((t) => "φ" + t).join(", ") || "none";
        const curAction = (frames[currentFrame].action_types || [])[a] || "idle";
        const cursorLine = currentFrame > 0
            ? `<br>Action chosen at t=${currentFrame}: <b>${escapeHtml(curAction)}</b> `
              + `(query/idle actions start no job, so they do not appear as bars).`
            : "";
        if (isCentralized) {
            note.innerHTML = `Centralized planner: knowledge is shared, so proofs/statements become public immediately and there is no trading. `
                + `Targets (initial open public statements): <b>${targetLabels}</b>.${cursorLine}`;
        } else {
            note.innerHTML = `Agent <b style="color:${agentColors[a]}">a_${a}</b>. Targets: <b>${targetLabels}</b> `
                + `Private proofs go public only on publish.${cursorLine}`;
        }
    }

    function renderAllCharts() {
      renderChart("returnChart", {
        maxX: frames.length - 1,
        xLabel: "Timestep",
        yLabel: "Return",
        series: [
          ...series.returns.map((values, agentId) => ({
            values,
            color: agentColors[agentId],
            label: `a_${agentId}`,
            width: 3,
          })),
          {
            values: series.return_mean,
            color: "#111827",
            label: "mean",
            width: 2.5,
            dashed: true,
          },
        ],
      });
    }

    function renderCurrentFrame() {
      stepReadout.textContent = `${currentFrame} / ${frames.length - 1}`;
      stepRange.value = String(currentFrame);
      renderGraph();
      renderJobStream();
      renderAllCharts();
      renderActorGraph();
    }

    stepRange.addEventListener("input", (event) => {
      currentFrame = Number(event.target.value);
      renderCurrentFrame();
    });

    function stepFrame(delta) {
      const next = Math.min(Math.max(currentFrame + delta, 0), frames.length - 1);
      if (next === currentFrame) return;
      currentFrame = next;
      renderCurrentFrame();
    }

    document.getElementById("stepBack").addEventListener("click", () => stepFrame(-1));
    document.getElementById("stepFwd").addEventListener("click", () => stepFrame(1));

    function buildViewToggle() {
      const buttons = ['<button type="button" data-view="global">Global</button>'];
      for (let i = 0; i < payload.num_agents; i += 1) {
        buttons.push(`<button type="button" data-view="${i}">${i}</button>`);
      }
      viewToggle.innerHTML = buttons.join("");
    }

    function setView(mode) {
      const isGlobal = mode === "global";
      selectedAgent = isGlobal ? null : Number(mode);
      layout.classList.toggle("view-global", isGlobal);
      layout.classList.toggle("view-agent", !isGlobal);
      viewToggle.querySelectorAll("button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === mode);
      });
      if (isGlobal) {
        // Cytoscape needs a resize once its container becomes visible again
        cy.resize();
        cy.fit(undefined, 50);
        drawOverlay();
      } else {
        // Fresh agent: drop any selection/structure from the previous agent
        actorSelection = null;
        actorSig = null;
        document.getElementById("agentViewTitle").textContent = `Agent ${selectedAgent}`;
        renderJobStream();
        renderActorGraph();
      }
    }

    viewToggle.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-view]");
      if (btn) setView(btn.dataset.view);
    });

    playPause.addEventListener("click", () => {
      if (autoplayTimer !== null) {
        window.clearInterval(autoplayTimer);
        autoplayTimer = null;
        playPause.textContent = "Autoplay";
        return;
      }
      playPause.textContent = "Pause";
      autoplayTimer = window.setInterval(() => {
        if (currentFrame >= frames.length - 1) {
          window.clearInterval(autoplayTimer);
          autoplayTimer = null;
          playPause.textContent = "Autoplay";
          return;
        }
        currentFrame += 1;
        renderCurrentFrame();
      }, 1000);
    });

    buildViewToggle();
    setView("global");
    describeGraphAvailability();
    renderCurrentFrame();
  </script>
</body>
</html>
