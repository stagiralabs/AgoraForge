<!doctype html><html><head><meta charset="utf-8"><title>__TITLE__</title>
<style>
:root{color-scheme:dark;--bg:#10141b;--panel:#18202b;--line:#344154;--muted:#97a5b8;--pro:#43c6ac;--con:#ff6b7a;--judge:#f4c95d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef3fa;font:14px system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0 0 6px}.muted{color:var(--muted)}main{display:grid;grid-template-columns:minmax(520px,1.5fr) minmax(340px,1fr);gap:12px;padding:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}svg{width:100%;height:560px;background:#121923;border-radius:6px}.edge{stroke-width:1.5;opacity:.55}.node{stroke:#b9c3d0;stroke-width:1}.node.target{stroke:var(--judge);stroke-width:4}.node.transcript{stroke:#fff;stroke-width:2}.node.selected{stroke:var(--judge);stroke-width:5}.label{font-size:10px;fill:white;text-anchor:middle;pointer-events:none}.controls{display:flex;align-items:center;gap:10px;margin-bottom:10px}input[type=range]{flex:1}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.metric{background:#111821;padding:9px;border-radius:5px}.metric b{display:block;font-size:18px}.bar{height:8px;background:#303a48;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--judge)}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}.pro{color:var(--pro)}.con{color:var(--con)}pre{white-space:pre-wrap;max-height:170px;overflow:auto;color:#c9d3df;font-size:11px}.legend span{margin-right:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
@media(max-width:900px){main{grid-template-columns:1fr}svg{height:480px}}
</style></head><body><header><h1 id="title"></h1><div class="muted" id="subtitle"></div></header><main><section class="panel"><div class="controls"><button id="prev">◀</button><input id="step" type="range" min="0"><button id="next">▶</button><b id="stepLabel"></b></div><svg id="graph" viewBox="0 0 800 560"></svg><div class="legend"><span><i class="dot" style="background:var(--pro)"></i>PRO reveal</span><span><i class="dot" style="background:var(--con)"></i>CON reveal</span><span><i class="dot" style="background:var(--judge)"></i>judge selected</span></div></section><aside class="panel"><h3>Estimate</h3><div class="metricgrid"><div class="metric">prior<b id="prior"></b></div><div class="metric">protocol<b id="prediction"></b></div><div class="metric">full target<b id="full"></b></div></div><div class="bar"><i id="predbar"></i></div><p class="muted" id="fitness"></p><h3>Turn</h3><table><thead><tr><th>role</th><th>action</th><th>reward</th><th>return</th></tr></thead><tbody id="actions"></tbody></table><h3>Transcript</h3><div id="transcript"></div><h3>Selected judge claims</h3><div id="selected"></div><h3>Protocol state (per transcript claim: PRO / CON)</h3><pre id="state"></pre></aside></main>
<script id="trajectory-data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.getElementById('trajectory-data').textContent), svg=document.getElementById('graph');
document.getElementById('title').textContent=D.title;document.getElementById('subtitle').textContent=`target claim ${D.target} · ${D.claims.length} claims · judge cap ${D.judge_cap}`;
const slider=document.getElementById('step');slider.max=D.steps.length;const NS='http://www.w3.org/2000/svg';
const pos=D.claims.map((_,i)=>{const a=2*Math.PI*i/D.claims.length-Math.PI/2,r=220+(i%3-1)*12;return [400+r*Math.cos(a),280+r*Math.sin(a)]});
function el(n,a={}){let x=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));return x}
D.edges.forEach(e=>{let x=el('line',{x1:pos[e.source][0],y1:pos[e.source][1],x2:pos[e.target][0],y2:pos[e.target][1],class:'edge',stroke:e.coupling>0?'#43c6ac':'#ff6b7a'});x.appendChild(el('title')).textContent=`J=${e.coupling.toFixed(3)}`;svg.appendChild(x)});
const nodes=D.claims.map(c=>{let g=el('g'),n=el('circle',{cx:pos[c.id][0],cy:pos[c.id][1],r:11,class:'node',fill:c.unary>=0?'#286b63':'#733844'}),t=el('text',{x:pos[c.id][0],y:pos[c.id][1]+3,class:'label'});t.textContent=c.id;n.appendChild(el('title')).textContent=`claim ${c.id} · unary ${c.unary.toFixed(3)} · p_full ${c.p_full.toFixed(3)} · truth ${c.truth}`;g.append(n,t);svg.appendChild(g);return n});
function fmt(x){return Number(x).toFixed(3)} function render(){let i=+slider.value,step=i?D.steps[i-1]:null,s=step?step.state:D.initial;document.getElementById('stepLabel').textContent=i?`turn ${i}/${D.steps.length}`:'initial';document.getElementById('prior').textContent=fmt(s.prior);document.getElementById('prediction').textContent=fmt(s.prediction);document.getElementById('full').textContent=fmt(s.full_target);document.getElementById('predbar').style.width=(100*s.prediction)+'%';document.getElementById('fitness').textContent=`fitness ${fmt(s.fitness)} · squared error ${fmt(1-s.fitness)}`;
let tbody=document.getElementById('actions');tbody.innerHTML='';if(step)step.actions.forEach((a,j)=>{let tr=document.createElement('tr');tr.innerHTML=`<td class="${j?'con':'pro'}">${a.role}</td><td>${a.type}${a.claim===null?'':' '+a.claim}<br><small>signal ‖·‖ ${fmt(a.signal_l2)}</small></td><td>${fmt(step.reward[j])}</td><td>${fmt(step.returns[j])}</td>`;tbody.appendChild(tr)});
document.getElementById('transcript').textContent=s.transcript.join(' → ');document.getElementById('selected').textContent=s.judge_selected.map(c=>`${c} (p=${fmt(s.judge_marginals[c])})`).join(', ')||'—';document.getElementById('state').textContent=s.transcript.map(c=>`${c}: [${s.protocol_state[c][0].map(fmt).join(', ')}] / [${s.protocol_state[c][1].map(fmt).join(', ')}]`).join('\n');
nodes.forEach((n,c)=>{let cls='node'+(c===D.target?' target':'')+(s.transcript.includes(c)?' transcript':'')+(s.judge_selected.includes(c)?' selected':'');n.setAttribute('class',cls);let rb=s.revealed_by[c];n.setAttribute('fill',rb[0]?'var(--pro)':rb[1]?'var(--con)':D.claims[c].unary>=0?'#286b63':'#733844')})}
slider.oninput=render;document.getElementById('prev').onclick=()=>{slider.value=Math.max(0,+slider.value-1);render()};document.getElementById('next').onclick=()=>{slider.value=Math.min(+slider.max,+slider.value+1);render()};render();
</script></body></html>
